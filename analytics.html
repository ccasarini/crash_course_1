    <title>Flood Archive Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #000000; 
            --accent: #fef01e; 
            --bg: #0b0b0b; 
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: #262626;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background: var(--primary);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 1.25rem; 
            font-style: italic; 
            margin: 0; 
        }

        .description { 
            color: var(--text-muted); 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
        }

        nav { display: flex; gap: 2rem; }
        nav a { 
            color: var(--text-muted); 
            text-decoration: none; 
            font-size: 0.75rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            transition: color 0.3s; 
        }
        nav a:hover { color: var(--accent); }

        .container {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 2.5rem;
        }

        @media (max-width: 600px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            transition: border-color 0.3s;
        }

        .card:hover { border-color: var(--accent); }

        .card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 2rem;
            color: var(--accent);
            font-style: italic;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        canvas {
            width: 100% !important;
            height: 320px !important;
        }

        .loading {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-style: italic;
            padding: 100px;
            color: var(--accent);
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>Flood Archive Analytics</h1>
        <p class="description">Visualizing historical flood patterns (1985-2024)</p>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="flood-archive-map.html">Flood Map</a>
    </nav>
</header>

<div class="container">
    <div id="loading" class="loading">Generating research data...</div>

    <div class="dashboard" id="dashboard" style="display: none;">
        <!-- Card 1: Fatalities per Year -->
        <div class="card">
            <h2>Total Fatalities per Year</h2>
            <canvas id="chartCountries"></canvas>
        </div>

        <!-- Card 2: Events per Year -->
        <div class="card">
            <h2>Flood Events per Year</h2>
            <canvas id="chartYears"></canvas>
        </div>

        <!-- Card 3: Events by Category -->
        <div class="card">
            <h2>Flood Events by Cause</h2>
            <canvas id="chartCategories"></canvas>
        </div>

        <!-- Card 4: Displaced by Severity -->
        <div class="card">
            <h2>Total Displaced People by Severity</h2>
            <canvas id="chartSeverity"></canvas>
        </div>
    </div>
</div>

<script>
    // Set global Chart.js defaults for the Lucy style
    Chart.defaults.color = '#a0a0a0';
    Chart.defaults.font.family = "'Inter', sans-serif";
    Chart.defaults.borderColor = '#262626';

    // 1. Fetch and Parse the CSV data
    Papa.parse("data/floodarchive_cleaned.txt", {
        download: true,
        header: true,
        dynamicTyping: true,
        complete: function(results) {
            processData(results.data);
        },
        error: function(err) {
            document.getElementById('loading').innerText = "Error loading data: " + err;
        }
    });

    function processData(data) {
        // Filter for Bangladesh and valid rows
        const cleanData = data.filter(row => row.Country === 'BANGLADESH' && row.Year);

        // --- (1) Aggregation: Dead per Year ---
        const deadPerYear = {};
        cleanData.forEach(row => {
            const dead = parseInt(row.Dead) || 0;
            deadPerYear[row.Year] = (deadPerYear[row.Year] || 0) + dead;
        });
        const sortedDeadYears = Object.entries(deadPerYear).sort((a, b) => a[0] - b[0]);

        // --- (2) Aggregation: Events per Year ---
        const yearCounts = {};
        cleanData.forEach(row => {
            yearCounts[row.Year] = (yearCounts[row.Year] || 0) + 1;
        });
        const sortedYears = Object.entries(yearCounts).sort((a, b) => a[0] - b[0]);

        // --- (3) Aggregation: Events by Category ---
        const categoryCounts = {};
        cleanData.forEach(row => {
            const cat = row.categorised_reason || "Unknown";
            categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
        });

        // --- (4) Aggregation: Displaced by Severity ---
        const severityDisplaced = {};
        cleanData.forEach(row => {
            const sev = row.Severity || 0;
            const displaced = parseInt(row.Displaced) || 0;
            severityDisplaced[sev] = (severityDisplaced[sev] || 0) + displaced;
        });
        const sortedSeverity = Object.entries(severityDisplaced).sort((a, b) => a[0] - b[0]);

        // Hide loading and show dashboard
        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard').style.display = 'grid';

        // --- Render Charts with Lucy Neon Accent ---
        createBarChart('chartCountries', 'Total Fatalities', sortedDeadYears.map(x => x[0]), sortedDeadYears.map(x => x[1]), '#ef4444');
        createLineChart('chartYears', 'Flood Events', sortedYears.map(x => x[0]), sortedYears.map(x => x[1]), '#fef01e');
        createBarChart('chartCategories', 'Events by Cause', Object.keys(categoryCounts), Object.values(categoryCounts), '#fef01e');
        createBarChart('chartSeverity', 'Total Displaced', sortedSeverity.map(x => "Level " + x[0]), sortedSeverity.map(x => x[1]), '#3b82f6');
    }

    function createBarChart(canvasId, label, labels, data, color) {
        new Chart(document.getElementById(canvasId), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: data,
                    backgroundColor: color,
                    borderRadius: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { 
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#161616',
                        titleFont: { family: 'Playfair Display' },
                        bodyFont: { family: 'Inter' },
                        borderColor: '#fef01e',
                        borderWidth: 1
                    }
                },
                scales: { 
                    y: { 
                        beginAtZero: true,
                        grid: { color: '#262626' }
                    },
                    x: {
                        grid: { display: false }
                    }
                }
            }
        });
    }

    function createLineChart(canvasId, label, labels, data, color) {
        new Chart(document.getElementById(canvasId), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: data,
                    borderColor: color,
                    borderWidth: 3,
                    pointBackgroundColor: color,
                    pointRadius: 0,
                    pointHoverRadius: 6,
                    backgroundColor: color + '11', 
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { 
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#161616',
                        borderColor: '#fef01e',
                        borderWidth: 1
                    }
                },
                scales: { 
                    y: { 
                        beginAtZero: true,
                        grid: { color: '#262626' }
                    },
                    x: {
                        grid: { display: false }
                    }
                }
            }
        });
    }
</script>

</body>
</html>
