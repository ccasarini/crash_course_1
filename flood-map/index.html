<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asia Historical Flood Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; text-align: center; }
        h1 { margin: 20px 0; }
        #map { height: 80vh; width: 90%; margin: 0 auto 20px auto; border: 2px solid #333; }
    </style>
</head>
<body>
    <h1>Historical Flood Events in Asia (1985-Present)</h1>
    <div id="map"></div>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize the map, centered on Asia
        var map = L.map('map').setView([34.0479, 100.6197], 4);

        // Add background map (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Load the GeoJSON file specifically for Asia
        fetch('asia_floods.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    onEachFeature: function (feature, layer) {
                        var popupContent = "<b>Country: </b>" + feature.properties.country + "<br>" +
                                           "<b>Date: </b>" + feature.properties.date + "<br>" +
                                           "<b>Cause: </b>" + feature.properties.cause + "<br>" +
                                           "<b>Deaths: </b>" + feature.properties.dead;
                        layer.bindPopup(popupContent);
                    },
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: "#ff7800",
                            color: "#000",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        });
                    }
                }).addTo(map);
            })
            .catch(error => console.error('Error loading the GeoJSON file:', error));
    </script>
</body>
</html>
