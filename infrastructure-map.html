<!DOCTYPE html>
<html>
<head>
    <title>Bangladesh Infrastructure Risk Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', sans-serif; }
        #map { height: 100vh; width: 100%; background: #f0f0f0; }
        .info-panel {
            position: absolute; top: 20px; right: 20px; background: white; padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; max-width: 250px;
        }
        .info-panel h2 { margin-top: 0; font-size: 1.2em; color: #1a365d; }
        .info-panel p { font-size: 0.85em; color: #4a5568; line-height: 1.4; margin: 5px 0; }
        
        /* Custom Shapes using CSS */
        .shape-circle { border-radius: 50%; border: 1px solid white; }
        .shape-square { border-radius: 0%; border: 1px solid white; }
        .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
        .symbol { width: 12px; height: 12px; margin-right: 8px; display: inline-block; }
    </style>
</head>
<body>
    <header style="position: fixed; top: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 2000; border-bottom: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
        <h1 style="margin: 0; font-size: 1.1rem; color: #1a365d;">Infrastructure Risk Map</h1>
        <nav style="display: flex; gap: 15px;">
            <a href="index.html" style="color: #4a5568; text-decoration: none; font-size: 0.85rem; font-weight: 600;">Home</a>
            <a href="flood-archive-map.html" style="color: #4a5568; text-decoration: none; font-size: 0.85rem; font-weight: 600;">Flood Map</a>
            <a href="analytics.html" style="color: #4a5568; text-decoration: none; font-size: 0.85rem; font-weight: 600;">Analytics</a>
            <a href="upload.html" style="color: #4a5568; text-decoration: none; font-size: 0.85rem; font-weight: 600;">Upload</a>
        </nav>
    </header>
    <div class="info-panel" style="top: 70px;">
        <h2>Risk Assessment</h2>
        <p>Comparison of Health and Education sites near flood zones.</p>
        <hr/>
        <div class="legend-item"><span class="symbol" style="background: #e53e3e; border-radius: 50%;"></span> Floods (Red Circle)</div>
        <div class="legend-item"><span class="symbol" style="background: #38a169; border-radius: 50%;"></span> Health (Green Circle)</div>
        <div class="legend-item"><span class="symbol" style="background: #805ad5; border-radius: 0%;"></span> Schools (Purple Square)</div>
        <div class="legend-item"><span class="symbol" style="background: #ed8936; border: 2px solid white; width:14px; height:14px;"></span> <strong>At-Risk (Orange)</strong></div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([23.8103, 90.4125], 7);
        var floodLayer = L.layerGroup().addTo(map);
        var healthLayer = L.layerGroup().addTo(map);
        var schoolLayer = L.layerGroup().addTo(map);
        var riskLayer = L.layerGroup().addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        var overlays = {
            "Flood Events": floodLayer,
            "Health Facilities": healthLayer,
            "Schools": schoolLayer,
            "At-Risk Sites": riskLayer
        };
        L.control.layers(null, overlays).addTo(map);

        // 1. Bangladesh Border
        fetch('data/bangladesh_border.geojson').then(res => res.json()).then(data => {
            L.geoJSON(data, { style: { color: '#cbd5e0', weight: 1, fillOpacity: 0.02 } }).addTo(map);
        });

        // 2. Floods (Red Circles)
        fetch('data/bangladesh_floods.geojson').then(res => res.json()).then(data => {
            L.geoJSON(data, {
                pointToLayer: (f, l) => L.circleMarker(l, { radius: 5, fillColor: "#e53e3e", color: "#fff", weight: 1, fillOpacity: 0.6 })
            }).addTo(floodLayer);
        });

        // 3. Health (Green Circles)
        fetch('data/health_facilities.geojson').then(res => res.json()).then(data => {
            L.geoJSON(data, {
                pointToLayer: (f, l) => L.circleMarker(l, { radius: 3, fillColor: "#38a169", color: "#fff", weight: 0.5, fillOpacity: 0.8 }),
                onEachFeature: (f, lyr) => lyr.bindPopup("Health: " + (f.properties.name || "Unnamed"))
            }).addTo(healthLayer);
        });

        // 4. Schools (Purple Squares)
        fetch('data/schools.geojson').then(res => res.json()).then(data => {
            L.geoJSON(data, {
                pointToLayer: (f, l) => L.marker(l, {
                    icon: L.divIcon({
                        className: 'shape-square',
                        html: '<div style="background:#805ad5; width:6px; height:6px;"></div>',
                        iconSize: [6, 6]
                    })
                }),
                onEachFeature: (f, lyr) => lyr.bindPopup("School: " + (f.properties.name || "Unnamed"))
            }).addTo(schoolLayer);
        });

        // 5. At-Risk Sites (Orange Highlights)
        const addRiskData = (url, type) => {
            fetch(url).then(res => res.json()).then(data => {
                L.geoJSON(data, {
                    pointToLayer: (f, l) => L.circleMarker(l, { 
                        radius: 7, fillColor: "#ed8936", color: "#fff", weight: 2, fillOpacity: 1 
                    }),
                    onEachFeature: (f, lyr) => lyr.bindPopup("<strong>⚠️ AT RISK " + type + "</strong><br/>" + (f.properties.name || "Unnamed"))
                }).addTo(riskLayer);
            });
        };
        addRiskData('data/at_risk_health_facilities.geojson', 'HEALTH');
        addRiskData('data/at_risk_schools.geojson', 'SCHOOL');

    </script>
</body>
</html>
