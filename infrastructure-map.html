<!DOCTYPE html>
<html>
<head>
    <title>Bangladesh Infrastructure Risk Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { 
            --primary: #000000; 
            --accent: #fef01e; 
            --bg: #0b0b0b; 
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: #262626;
        }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }
        header { background: var(--primary); color: white; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; z-index: 2000; border-bottom: 1px solid var(--border); }
        header h1 { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-style: italic; margin: 0; }
        nav { display: flex; gap: 2rem; }
        nav a { color: var(--text-muted); text-decoration: none; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.3s; }
        nav a:hover { color: var(--accent); }
        
        #map { flex: 1; width: 100%; filter: invert(90%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        
        .info-panel {
            position: absolute; top: 80px; right: 20px; background: var(--card-bg); padding: 1.5rem;
            border-radius: 4px; border: 1px solid var(--border); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); z-index: 1000; max-width: 280px;
        }
        .info-panel h2 { font-family: 'Playfair Display', serif; margin-top: 0; font-size: 1.25rem; color: var(--accent); font-style: italic; }
        .info-panel p { font-size: 0.8rem; color: var(--text-muted); line-height: 1.6; margin: 10px 0; }
        
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; color: white; }
        .symbol { width: 10px; height: 10px; margin-right: 12px; display: inline-block; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <header>
        <h1>Infrastructure Risk Map</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="flood-archive-map.html">Flood Map</a>
            <a href="analytics.html">Analytics</a>
        </nav>
    </header>
    <div class="info-panel">
        <h2>Risk Assessment</h2>
        <p>Analyzing critical health and education infrastructure proximity to historical flood zones.</p>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 1.5rem 0;"/>
        <div class="legend-item"><span class="symbol" style="background: #ef4444; border-radius: 50%;"></span> Flood Events</div>
        <div class="legend-item"><span class="symbol" style="background: #10b981; border-radius: 50%;"></span> Health Sites</div>
        <div class="legend-item"><span class="symbol" style="background: #8b5cf6;"></span> Schools</div>
        <div class="legend-item"><span class="symbol" style="background: #f59e0b; border: 2px solid white; width:12px; height:12px; border-radius: 50%;"></span> <strong>High Risk (At-Risk)</strong></div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([23.8103, 90.4125], 7);
        var floodLayer = L.layerGroup().addTo(map);
        var healthLayer = L.layerGroup().addTo(map);
        var schoolLayer = L.layerGroup().addTo(map);
        var riskLayer = L.layerGroup().addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        var overlays = {
            "Flood Events": floodLayer,
            "Health Facilities": healthLayer,
            "Schools": schoolLayer,
            "At-Risk Sites": riskLayer
        };
        L.control.layers(null, overlays).addTo(map);

        // 1. Bangladesh Border
        fetch('data/bangladesh_border.geojson').then(res => res.json()).then(data => {
            L.geoJSON(data, { style: { color: '#cbd5e0', weight: 1, fillOpacity: 0.02 } }).addTo(map);
        });

        // 2. Floods (Red Circles)
        fetch('data/bangladesh_floods.geojson').then(res => res.json()).then(data => {
            L.geoJSON(data, {
                pointToLayer: (f, l) => L.circleMarker(l, { radius: 5, fillColor: "#e53e3e", color: "#fff", weight: 1, fillOpacity: 0.6 })
            }).addTo(floodLayer);
        });

        // 3. Health (Green Circles)
        fetch('data/health_facilities.geojson').then(res => res.json()).then(data => {
            L.geoJSON(data, {
                pointToLayer: (f, l) => L.circleMarker(l, { radius: 3, fillColor: "#38a169", color: "#fff", weight: 0.5, fillOpacity: 0.8 }),
                onEachFeature: (f, lyr) => lyr.bindPopup("Health: " + (f.properties.name || "Unnamed"))
            }).addTo(healthLayer);
        });

        // 4. Schools (Purple Squares)
        fetch('data/schools.geojson').then(res => res.json()).then(data => {
            L.geoJSON(data, {
                pointToLayer: (f, l) => L.marker(l, {
                    icon: L.divIcon({
                        className: 'shape-square',
                        html: '<div style="background:#805ad5; width:6px; height:6px;"></div>',
                        iconSize: [6, 6]
                    })
                }),
                onEachFeature: (f, lyr) => lyr.bindPopup("School: " + (f.properties.name || "Unnamed"))
            }).addTo(schoolLayer);
        });

        // 5. At-Risk Sites (Orange Highlights)
        const addRiskData = (url, type) => {
            fetch(url).then(res => res.json()).then(data => {
                L.geoJSON(data, {
                    pointToLayer: (f, l) => L.circleMarker(l, { 
                        radius: 7, fillColor: "#ed8936", color: "#fff", weight: 2, fillOpacity: 1 
                    }),
                    onEachFeature: (f, lyr) => lyr.bindPopup("<strong>⚠️ AT RISK " + type + "</strong><br/>" + (f.properties.name || "Unnamed"))
                }).addTo(riskLayer);
            });
        };
        addRiskData('data/at_risk_health_facilities.geojson', 'HEALTH');
        addRiskData('data/at_risk_schools.geojson', 'SCHOOL');

    </script>
</body>
</html>
